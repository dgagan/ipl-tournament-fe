server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Reverse-proxy to the backend container (Docker Compose service name
    # "backend"), stripping the /api/ prefix so /api/auth/login -> /auth/login.
    location /api/ {
        proxy_pass http://backend:3000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # SPA client-side routing: any path not matched above falls back to
    # index.html so a hard refresh on e.g. /teams/me doesn't 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
